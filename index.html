<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Autobiography - Genesis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            letter-spacing: 0.06em;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .bar-container {
            position: absolute;
            background-color: #333333;
            border-radius: 6px;
            z-index: 10;
            opacity: 1;
        }

        #bottom-bar {
            bottom: 5%;
            left: 5%;
            width: 90%;
            height: 6px;
        }

        .bar-fill {
            position: absolute;
            background-color: #777777;
            border-radius: 6px;
            transition: width 0.1s linear;
        }

        #bottom-bar .bar-fill {
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
        }

        .bar-text {
            position: absolute;
            font-size: 1rem;
            color: #cc4444;
            font-family: 'Courier New', Courier, monospace;
        }

        #bottom-bar .bar-text {
            right: 0;
            bottom: -24px;
        }

        #start-wrapper {
            display: none;
            position: relative;
            width: 100px;
            height: 100px;
            z-index: 15;
            opacity: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .ripple {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            border: 2px solid #cc4444;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(1);
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        #start-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            letter-spacing: 0.2em;
            color: #cc4444;
            pointer-events: none;
            z-index: 3;
        }

        #hold-label {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: #888888;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 0.2em;
            z-index: 10;
            opacity: 0;
            display: none;
        }

        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 2;
        }

        .progress-ring__circle {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            stroke-linecap: round;
        }

        /* Name & Date styles */
        .sketch-text {
            position: absolute;
            opacity: 0;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 0.1em;
            z-index: 5;
            text-align: center;
        }

        #text-name {
            top: 40%;
            font-size: 1.5rem;
        }

        #text-date {
            top: 60%;
            font-size: 1.2rem;
            color: #cc4444;
        }

        /* Scribble SVG */
        #scribble-svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 200%;
            pointer-events: none;
            z-index: 10;
        }

        #scribble-path {
            fill: none;
            stroke: #cc4444;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Final scene — photo container */
        #photo-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            height: 60vh;
            z-index: 4;
            opacity: 0;
            pointer-events: none;
        }

        .carousel-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #enter-btn {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: transparent;
            border: 1px solid #cc4444;
            color: #cc4444;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 0.2em;
            cursor: pointer;
            opacity: 0;
            display: none;
            z-index: 20;
            transition: background 0.3s, color 0.3s;
        }

        #enter-btn:hover {
            background: #cc4444;
            color: #0a0a0a;
        }

        /* ══ Scene 0 : Gravity Text ══ */
        #gravity-scene {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
        }

        #gravity-verse {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: clamp(13px, 1.5vw, 17px);
            line-height: 2.6;
            letter-spacing: 1.8px;
            word-spacing: 0.2em;
            text-align: center;
            color: #c8c8c8;
            max-width: 640px;
            padding: 0 32px;
            position: relative;
            z-index: 2;
        }

        #gravity-verse .gch {
            display: inline-block;
            opacity: 0;
        }

        .g-faller {
            position: absolute;
            font-family: 'Georgia', serif;
            font-style: italic;
            color: #c8c8c8;
            pointer-events: none;
            transform-origin: top center;
            will-change: transform, opacity;
            z-index: 3;
        }

        #transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #transition-overlay canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>

    <!-- ══ Scene 0 : Gravity Text ══ -->
    <div id="gravity-scene">
        <div id="gravity-verse"></div>
    </div>

    <div id="bottom-bar" class="bar-container">
        <div class="bar-fill"></div>
        <div class="bar-text">0%</div>
    </div>

    <div id="start-wrapper">
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="ripple"></div>
        <svg class="progress-ring" width="100" height="100">
            <circle class="progress-ring__circle" stroke="#ffffff" stroke-width="2" fill="transparent" r="46" cx="50"
                cy="50" />
        </svg>
        <div id="start-text">START</div>
    </div>

    <div id="hold-label">Hold</div>

    <div id="photo-container">
        <img src="image/IMG_1514.JPG" class="carousel-image" alt="Memory">
        <img src="image/IMG_2334.JPG" class="carousel-image" alt="Memory">
        <img src="image/IMG_4131.JPG" class="carousel-image" alt="Memory">
        <img src="image/IMG_4221.JPG" class="carousel-image" alt="Memory">
        <img src="image/IMG_4732.JPG" class="carousel-image" alt="Memory">
        <img src="image/IMG_4832.JPG" class="carousel-image" alt="Memory">
        <img src="image/IMG_5013.JPG" class="carousel-image" alt="Memory">
        <img src="image/IMG_5120.JPG" class="carousel-image" alt="Memory">
    </div>

    <div id="text-name" class="sketch-text">SHIUE SHIANG CHIAN</div>

    <div id="text-date" class="sketch-text">
        2006.3.14.
        <svg id="scribble-svg" viewBox="0 0 100 30" preserveAspectRatio="none">
            <path id="scribble-path" d="M -5,15 Q 10,-5 15,25 T 35,5 T 45,28 T 65,2 T 75,25 T 95,5 T 105,20"></path>
        </svg>
    </div>

    <button id="enter-btn">ENTER RADIO</button>
    <div id="transition-overlay"><canvas id="cloud-gl"></canvas></div>

    <script>
        /* ══ Scene 0 : Typewriter + Gravity Fall ══ */
        (function () {
            const VERSE = "So do not fear, for I am with you;\ndo not be dismayed, for I am your God.\nI will strengthen you and help you;\nI will uphold you with my righteous right hand.";

            const scene     = document.getElementById('gravity-scene');
            const container = document.getElementById('gravity-verse');

            // Build character spans
            const charSpans = [];
            VERSE.split('').forEach(ch => {
                if (ch === '\n') { container.appendChild(document.createElement('br')); return; }
                const sp = document.createElement('span');
                sp.className   = 'gch';
                if (ch === ' ') {
                    sp.innerHTML = '&nbsp;';
                } else {
                    sp.textContent = ch;
                }
                container.appendChild(sp);
                charSpans.push(sp);
            });

            // Typewriter
            let ti = 0;
            function typeNext() {
                if (ti >= charSpans.length) { setTimeout(startFall, 2800); return; }
                charSpans[ti].style.opacity = '1';
                ti++;
                const ch    = charSpans[ti - 1].textContent;
                const pause = (ch === ',' || ch === '.' || ch === ';') ? 280 : 0;
                setTimeout(typeNext, 55 + pause + (Math.random() < 0.06 ? 150 : 0));
            }
            setTimeout(typeNext, 900);

            // Gravity fall
            function startFall() {
                const sorted = [...charSpans].sort((a, b) => {
                    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
                    return (ra.left + ra.width / 2) - (rb.left + rb.width / 2);
                });
                sorted.forEach((span, i) => setTimeout(() => fallChar(span), i * 20 + Math.random() * 40));
                setTimeout(transitionToMain, sorted.length * 20 + 2200);
            }

            function fallChar(span) {
                const rect  = span.getBoundingClientRect();
                const sRect = scene.getBoundingClientRect();
                const sx    = rect.left - sRect.left + rect.width / 2;
                const sy    = rect.top  - sRect.top;
                const size  = parseFloat(getComputedStyle(span).fontSize);

                span.style.opacity = '0';

                const el = document.createElement('div');
                el.className   = 'g-faller';
                el.textContent = span.textContent;
                el.style.cssText = `font-size:${size}px;left:${sx}px;top:${sy}px;opacity:1;`;
                scene.appendChild(el);

                const tilt    = (Math.random() - .5) * 18;
                const sway    = (Math.random() - .5) * 34;
                const dur     = 1100 + Math.random() * 900;
                const dist    = sRect.height - sy + size * 2;
                let   start   = null;

                (function step(ts) {
                    if (!start) start = ts;
                    const p     = Math.min((ts - start) / dur, 1);
                    const grav  = p < 0.12 ? 0 : Math.pow((p - 0.12) / 0.88, 1.9);
                    const alpha = p > 0.7  ? 1 - (p - 0.7) / 0.3 : 1;
                    el.style.transform = `translate(-50%,0) rotate(${tilt * p}deg)`;
                    el.style.left      = (sx + sway * Math.sin(p * Math.PI * 0.6)) + 'px';
                    el.style.top       = (sy + grav * dist) + 'px';
                    el.style.opacity   = alpha;
                    if (p < 1) requestAnimationFrame(step); else el.remove();
                })(performance.now());
            }

            function transitionToMain() {
                gsap.to(scene, {
                    opacity: 0, duration: 1.3, ease: 'power2.in',
                    onComplete: () => { scene.style.display = 'none'; startMainScene(); }
                });
            }
        })();

        /* ══ Main scene logic ══ */
        function startMainScene() {
        const bottomBarFill = document.querySelector('#bottom-bar .bar-fill');
        const bottomBarText = document.querySelector('#bottom-bar .bar-text');
        const startWrapper = document.getElementById('start-wrapper');
        const holdLabel = document.getElementById('hold-label');
        const textName = document.getElementById('text-name');
        const textDate = document.getElementById('text-date');
        const photoContainer = document.getElementById('photo-container');
        const images = document.querySelectorAll('.carousel-image');
        const scribblePath = document.getElementById('scribble-path');
        const circle = document.querySelector('.progress-ring__circle');
        const ripples = document.querySelectorAll('.ripple');
        const enterBtn = document.getElementById('enter-btn');
        const transitionOverlay = document.getElementById('transition-overlay');
        let heartSound;

        // SVG path length
        const pathLength = scribblePath.getTotalLength();
        scribblePath.style.strokeDasharray = pathLength;
        scribblePath.style.strokeDashoffset = pathLength;

        const circumference = circle.r.baseVal.value * 2 * Math.PI;
        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = circumference;

        let loadData = { percent: 0 };
        let pressTween, rippleTween, isTransitioning = false;

        // --- Scene 1 : Loading bar ---
        gsap.to(loadData, {
            percent: 100, duration: 8, ease: "power2.inOut",
            onUpdate: () => {
                bottomBarFill.style.width = Math.round(loadData.percent) + "%";
                bottomBarText.innerHTML = Math.round(loadData.percent) + "%";
            },
            onComplete: () => {
                gsap.to(".bar-container", {
                    opacity: 0, duration: 1, onComplete: () => {
                        document.querySelectorAll('.bar-container').forEach(el => el.style.display = 'none');
                        startWrapper.style.display = 'block';
                        holdLabel.style.display = 'block';
                        gsap.to([startWrapper, holdLabel], { opacity: 1, duration: 1 });
                    }
                });
            }
        });

        // --- Scene 2 : Hold interaction ---
        function startPress(e) {
            if (isTransitioning) return;
            if (e.type === 'touchstart') e.preventDefault();
            pressTween = gsap.to(circle, { strokeDashoffset: 0, duration: 1.5, ease: "power1.inOut", onComplete: triggerNextScene });
            rippleTween = gsap.to(ripples, { scale: 18, opacity: (i) => 0.5 - (i * 0.08), duration: 2, stagger: 0.12, ease: "power2.inOut" });
        }

        function cancelPress() {
            if (isTransitioning) return;
            if (pressTween) pressTween.kill();
            if (rippleTween) rippleTween.kill();
            gsap.to(circle, { strokeDashoffset: circumference, duration: 0.3 });
            gsap.to(ripples, { scale: 1, opacity: 0, duration: 0.3 });
        }

        // --- Scene 3 : Name / Date / Strikethrough / Carousel ---
        function triggerNextScene() {
            isTransitioning = true;
            gsap.to([startWrapper, holdLabel], {
                opacity: 0, duration: 0.5, onComplete: () => {
                    startWrapper.style.display = 'none';
                    holdLabel.style.display = 'none';
                }
            });

            // 1. Reveal name & date
            gsap.to([textName, textDate], { opacity: 1, y: -20, duration: 2, stagger: 0.5, ease: "power2.out" });

            // 2. Play heartbeat sound
            heartSound = new Audio('https://actions.google.com/sounds/v1/foley/heartbeat.ogg');
            heartSound.loop = true;
            heartSound.volume = 0.5;
            heartSound.play().catch(() => { });

            // 3. Animation timeline
            let tl = gsap.timeline({ delay: 3.5 });

            tl.to(scribblePath, {
                strokeDashoffset: 0, duration: 0.4, ease: "power4.inOut"
            })
                .to([textName, textDate], {
                    opacity: 0, y: -30, duration: 1, ease: "power2.in"
                }, "+=1.0") // pause 1s after strikethrough then fade
                .to(photoContainer, {
                    opacity: 1, duration: 1.5,
                    onStart: startPhotoCarousel // start carousel when photo container appears
                });
        }

        function startPhotoCarousel() {
            let currentIdx = 0;
            if (images.length > 0) gsap.set(images[0], { opacity: 1 });

            // Carousel: switch every 0.5s
            setInterval(() => {
                if (images.length === 0) return;
                gsap.to(images[currentIdx], { opacity: 0, duration: 0.3 });
                currentIdx = (currentIdx + 1) % images.length;
                gsap.to(images[currentIdx], { opacity: 1, duration: 0.3 });
            }, 500);

            // Show enter button
            setTimeout(() => {
                enterBtn.style.display = 'block';
                gsap.to(enterBtn, { opacity: 1, duration: 1 });
            }, 2000);
        }

        // ── Full-page WebGL cloud transition ──
        function initCloudTransition() {
            const canvas = document.getElementById('cloud-gl');
            const gl = canvas.getContext('webgl');

            const VS = `attribute vec2 a_pos; void main(){ gl_Position = vec4(a_pos,0,1); }`;
            const FS = `
                precision highp float;
                uniform vec2  u_res;
                uniform float u_time;
                float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
                float noise(vec2 p){
                    vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);
                    return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
                }
                float fbm(vec2 p){
                    float v=0.0,a=0.5;
                    for(int i=0;i<6;i++){ v+=a*noise(p); p=p*2.1+vec2(1.7,9.2); a*=0.5; }
                    return v;
                }
                void main(){
                    vec2 uv=gl_FragCoord.xy/u_res; uv.y=1.0-uv.y;
                    float t=u_time*0.16;
                    vec2 q=vec2(fbm(uv+t),fbm(uv+vec2(1.0)));
                    vec2 r=vec2(fbm(uv+2.0*q+vec2(1.7,9.2)+0.15*t),fbm(uv+2.0*q+vec2(8.3,2.8)+0.126*t));
                    float f=smoothstep(0.0,1.0,fbm(uv+2.8*r));
                    vec3 col=mix(vec3(0.984,0.984,0.984),vec3(1.0,0.72,0.72),f);
                    col=mix(col,vec3(0.87,0.0,0.05),pow(f,2.8)*1.3);
                    col=mix(col,vec3(0.6,0.0,0.04),pow(f,6.0)*0.6);
                    gl_FragColor=vec4(col,1.0);
                }
            `;

            function mkS(src, type) {
                const s = gl.createShader(type);
                gl.shaderSource(s, src); gl.compileShader(s); return s;
            }
            const prog = gl.createProgram();
            gl.attachShader(prog, mkS(VS, gl.VERTEX_SHADER));
            gl.attachShader(prog, mkS(FS, gl.FRAGMENT_SHADER));
            gl.linkProgram(prog); gl.useProgram(prog);

            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
            const aPos = gl.getAttribLocation(prog, 'a_pos');
            const uRes = gl.getUniformLocation(prog, 'u_res');
            const uTime = gl.getUniformLocation(prog, 'u_time');
            gl.enableVertexAttribArray(aPos);
            gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
            resize();
            window.addEventListener('resize', resize);

            const start = performance.now();
            (function render() {
                const t = (performance.now() - start) / 1000;
                gl.uniform2f(uRes, canvas.width, canvas.height);
                gl.uniform1f(uTime, t);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            })();
        }
        initCloudTransition();

        enterBtn.addEventListener('click', () => {
            // Cloud fade in
            transitionOverlay.style.opacity = '1';
            if (heartSound) {
                gsap.to(heartSound, { volume: 0, duration: 1.2, onComplete: () => heartSound.pause() });
            }
            // Run cloud shader then navigate
            setTimeout(() => {
                window.location.href = 'radio-alice.html';
            }, 1400);
        });

        startWrapper.addEventListener('mousedown', startPress);
        startWrapper.addEventListener('touchstart', startPress, { passive: false });
        startWrapper.addEventListener('mouseup', cancelPress);
        startWrapper.addEventListener('mouseleave', cancelPress);
        startWrapper.addEventListener('touchend', cancelPress);
        } // end startMainScene
    </script>
</body>

</html>
