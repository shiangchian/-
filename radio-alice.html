<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RadioAlice</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --red: #de000d;
    --white: #fbfbfb;
    --grid: 96;
    --gv: calc(100vw / var(--grid));
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--white);
    color: var(--red);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  letter-spacing: 0.06em;
  }

  canvas#gl {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ── HEADER ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: grid;
    grid-template-columns: auto auto 1fr auto auto auto auto;
    align-items: start;
    padding: calc(var(--gv) * 1) calc(var(--gv) * 1);
    gap: 0;
    z-index: 30;
    pointer-events: none;
  }

  .logo {
    font-size: clamp(16px, calc(var(--gv) * 2.2), 36px);
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.01em;
    pointer-events: all;
    cursor: pointer;
    grid-column: 1;
  }

  .tagline {
    font-size: clamp(9px, calc(var(--gv) * 0.875), 12px);
    line-height: 1.35;
    color: var(--red);
    padding-left: calc(var(--gv) * 2);
    padding-top: 2px;
    max-width: 300px;
    grid-column: 2;
  }

  .spacer { grid-column: 3; }

  .nav-history {
    font-size: clamp(9px, calc(var(--gv) * 0.875), 12px);
    padding-top: 2px;
    pointer-events: all;
    cursor: pointer;
    grid-column: 4;
    position: relative;
  }

  .nav-history::after {
    content: '';
    position: absolute;
    bottom: -1px; left: -2px; right: -2px;
    height: 1px;
    background: var(--red);
    transform: scaleX(0);
    transform-origin: center;
    transition: transform .3s cubic-bezier(.215,.61,.355,1);
  }
  .nav-history:hover::after { transform: scaleX(1); }

  /* radio wave bars */
  .sound-btn {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 2px calc(var(--gv) * 1);
    padding-top: 4px;
    cursor: pointer;
    pointer-events: all;
    grid-column: 5;
    background: none;
    border: none;
    color: var(--red);
  }

  .sound-btn span {
    display: block;
    width: 1px;
    height: 1px;
    background: var(--red);
    transform-origin: bottom center;
  }

  @keyframes radioWave {
    0%, 100% { transform: scaleY(1); }
    50%       { transform: scaleY(8); }
  }

  .sound-btn[data-state="playing"] span:nth-child(1) { animation: radioWave 1s   steps(5)  infinite; }
  .sound-btn[data-state="playing"] span:nth-child(2) { animation: radioWave 1.4s steps(8)  infinite; }
  .sound-btn[data-state="playing"] span:nth-child(3) { animation: radioWave .5s  steps(10) infinite; }
  .sound-btn[data-state="playing"] span:nth-child(4) { animation: radioWave 1s   steps(7)  infinite; }
  .sound-btn[data-state="playing"] span:nth-child(5) { animation: radioWave 1.1s steps(3)  infinite; }
  .sound-btn[data-state="playing"] span:nth-child(6) { animation: radioWave 1.5s steps(12) infinite; }
  .sound-btn[data-state="playing"] span:nth-child(7) { animation: radioWave 1s   steps(6)  infinite; }

  .nav-tracklist {
    font-size: clamp(9px, calc(var(--gv) * 0.875), 12px);
    padding-top: 2px;
    pointer-events: all;
    cursor: pointer;
    grid-column: 6;
    position: relative;
  }
  .nav-tracklist::after {
    content: '';
    position: absolute;
    bottom: -1px; left: -2px; right: -2px;
    height: 1px;
    background: var(--red);
    transform: scaleX(0);
    transform-origin: center;
    transition: transform .3s cubic-bezier(.215,.61,.355,1);
  }
  .nav-tracklist:hover::after { transform: scaleX(1); }

  /* theme switcher triangles */
  .theme-selector {
    display: flex;
    gap: calc(var(--gv) * 0.4);
    grid-column: 7;
    padding-left: calc(var(--gv) * 0.75);
    padding-top: 2px;
    pointer-events: all;
  }

  .tsq {
    width: calc(var(--gv) * 1);
    height: calc(var(--gv) * 1);
    min-width: 12px;
    min-height: 12px;
    max-width: 16px;
    max-height: 16px;
    position: relative;
    cursor: pointer;
  }

  .tsq::before, .tsq::after {
    content: '';
    position: absolute;
    inset: 0;
  }

  .tsq-red::before  { border-right: 16px solid var(--red);    border-top: 16px solid var(--white); }
  .tsq-red::after   { border: 1px solid var(--red); }
  .tsq-dark::before { border-right: 16px solid #000;           border-top: 16px solid var(--white); }
  .tsq-dark::after  { border: 1px solid #000; }
  .tsq-light::before{ border-right: 16px solid var(--white);   border-top: 16px solid #000; }
  .tsq-light::after { border: 1px solid #000; }

  .tsq-active::after { border-color: var(--white) !important; }

  /* ── PLAYER BAR ── */
  .player {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: grid;
    grid-template-columns:
      calc(var(--gv) * 1)      /* play btn */
      1fr                       /* spacing */
      auto                      /* track */
      1fr                       /* spacing */
      auto                      /* artist */
      1fr
      auto                      /* time */
      1fr
      auto;                     /* prev/next */
    align-items: center;
    padding: 0 calc(var(--gv) * 1);
    padding-bottom: calc(var(--gv) * 1.5);
    z-index: 30;
    pointer-events: none;
  }

  .play-toggle {
    cursor: pointer;
    pointer-events: all;
    background: none;
    border: none;
    color: var(--red);
    font-size: 16px;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* pause bars */
  .pause-icon { display: flex; gap: 3px; align-items: center; }
  .pause-icon span {
    display: block;
    width: 2px;
    height: 14px;
    background: var(--red);
    transition: transform .4s cubic-bezier(.215,.61,.355,1);
  }

  /* play triangle */
  .play-icon {
    width: 0; height: 0;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-left: 12px solid var(--red);
    transition: transform .4s cubic-bezier(.215,.61,.355,1);
  }

  .play-toggle[data-state="playing"] .pause-icon { display: flex; }
  .play-toggle[data-state="playing"] .play-icon  { display: none; }
  .play-toggle[data-state="paused"]  .pause-icon { display: none; }
  .play-toggle[data-state="paused"]  .play-icon  { display: block; }

  .p-track, .p-artist, .p-time {
    font-size: clamp(9px, calc(var(--gv) * 0.875), 12px);
    text-align: center;
    pointer-events: none;
  }

  .p-controls {
    display: flex;
    gap: calc(var(--gv) * 0.5);
    pointer-events: all;
    cursor: pointer;
    align-items: center;
  }

  .p-controls svg {
    width: 16px;
    height: 16px;
    fill: var(--red);
  }

  /* progress */
  .progress {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: calc(var(--gv) * 0.5);
    min-height: 3px;
    background: rgba(222, 0, 13, .18);
    z-index: 29;
    cursor: pointer;
    pointer-events: all;
  }

  .progress-fill {
    height: 100%;
    background: var(--red);
    width: 0%;
    transition: width .1s linear;
    transform-origin: left;
  }

  /* ── TICKER ── */
  .ticker-wrap {
    position: fixed;
    bottom: calc(var(--gv) * 1.8);
    left: 0; right: 0;
    overflow: hidden;
    height: 14px;
    z-index: 28;
    pointer-events: none;
  }

  .ticker-inner {
    display: inline-block;
    white-space: nowrap;
    font-size: 9px;
    font-family: 'Courier New', monospace;
    color: rgba(222, 0, 13, .45);
    letter-spacing: .06em;
    animation: ticker-scroll 32s linear infinite;
  }

  @keyframes ticker-scroll {
    0%   { transform: translateX(100vw); }
    100% { transform: translateX(-100%); }
  }

  /* ── TRACKLIST PANEL ── */
  .tracklist-panel {
    position: fixed;
    top: 0; right: 0;
    width: min(380px, 100vw);
    height: 100%;
    background: var(--red);
    color: var(--white);
    z-index: 40;
    transform: translateX(100%);
    transition: transform .5s cubic-bezier(.215,.61,.355,1);
    display: flex;
    flex-direction: column;
    padding-top: calc(var(--gv) * 5);
    overflow: hidden;
  }

  .tracklist-panel.open { transform: translateX(0); }

  .tracklist-panel .tl-close {
    position: absolute;
    top: calc(var(--gv) * 1);
    left: calc(var(--gv) * 1);
    font-size: clamp(9px, calc(var(--gv) * 0.875), 12px);
    cursor: pointer;
    pointer-events: all;
    color: var(--white);
    background: none; border: none;
  }

  .tl-title {
    font-size: clamp(28px, calc(var(--gv) * 3.5), 52px);
    line-height: .84;
    padding: 0 calc(var(--gv) * 1) calc(var(--gv) * 1.5);
  }

  .tl-head {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: calc(var(--gv) * .5) calc(var(--gv) * 1);
    font-size: clamp(9px, calc(var(--gv) * 0.875), 12px);
    border-bottom: 1px solid rgba(251,251,251,.3);
  }

  .tl-list { overflow-y: auto; flex: 1; }

  .tl-item {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: calc(var(--gv) * .75) calc(var(--gv) * 1);
    font-size: clamp(9px, calc(var(--gv) * 0.875), 12px);
    border-bottom: 1px solid rgba(251,251,251,.2);
    cursor: pointer;
    transition: opacity .2s;
  }
  .tl-item:hover { opacity: .7; }
  .tl-item.active { font-weight: 700; }

  .panel-overlay {
    position: fixed;
    inset: 0;
    z-index: 39;
    display: none;
  }
  .panel-overlay.open { display: block; }

  /* ── NEXT PAGE BUTTON ── */
  .next-btn {
    position: fixed;
    bottom: calc(var(--gv) * 3.5);
    right: calc(var(--gv) * 1);
    z-index: 50;
    background: none;
    border: none;
    cursor: pointer;
    pointer-events: all;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--red);
    font-size: clamp(9px, calc(var(--gv) * 0.875), 12px);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing: .12em;
    opacity: 0;
    animation: fadeInBtn 1s ease 2s forwards;
  }
  @keyframes fadeInBtn {
    to { opacity: 1; }
  }
  .next-btn:hover .next-arrow { transform: translateX(5px); }
  .next-arrow {
    display: inline-block;
    transition: transform .3s cubic-bezier(.215,.61,.355,1);
  }

  /* ── PAGE TRANSITION OVERLAY ── */
  #page-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #fbfbfb;
    opacity: 0;
    pointer-events: none;
    transition: opacity .7s cubic-bezier(.4,0,.2,1);
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<!-- HEADER -->
<header>
  <div class="logo"></div>
  <p class="tagline"></p>
  <div class="spacer"></div>
  <div class="nav-history"></div>
  <button class="sound-btn" id="soundBtn" data-state="paused">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </button>
  <div class="nav-tracklist" id="openTracklist"></div>
  <div class="theme-selector">
    <div class="tsq tsq-red tsq-active"  data-theme="red"></div>
    <div class="tsq tsq-dark"            data-theme="dark"></div>
    <div class="tsq tsq-light"           data-theme="light"></div>
  </div>
</header>

<!-- PLAYER -->
<div class="player">
  <button class="play-toggle" id="playBtn" data-state="paused">
    <div class="pause-icon"><span></span><span></span></div>
    <div class="play-icon"></div>
  </button>
  <div></div>
  <div class="p-track" id="trackName"></div>
  <div></div>
  <div class="p-artist" id="artistName"></div>
  <div></div>
  <div class="p-time" id="timeDisplay"></div>
  <div></div>
  <div class="p-controls">
    <svg id="prevBtn" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    <svg id="nextBtn" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
  </div>
</div>

<div class="progress" id="progressBar">
  <div class="progress-fill" id="progressFill"></div>
</div>

<div class="ticker-wrap">
  <div class="ticker-inner">No one is home at the moment — please call back later, thank you. — No one is home at the moment — please call back later, thank you. —</div>
</div>

<!-- NEXT PAGE -->
<div id="page-overlay"></div>
<button class="next-btn" id="nextPageBtn">
  Memories <span class="next-arrow">→</span>
</button>

<!-- TRACKLIST PANEL -->
<div class="panel-overlay" id="overlay"></div>
<div class="tracklist-panel" id="tlPanel">
  <button class="tl-close" id="closeTracklist">Close</button>
  <div class="tl-title">Tracklist</div>
  <div class="tl-head"><span>Title</span><span>Artist</span></div>
  <div class="tl-list" id="tlList"></div>
</div>

<script>
/* ── TRACKLIST DATA ── */
const tracks = [
  { title: 'Shattered Reality',               artist: 'Distorsonic',      duration: 240 },
  { title: 'ACAB',                             artist: 'Alos',             duration: 195 },
  { title: 'Il crollo del cielo',              artist: 'Xabier Iriondo',   duration: 318 },
  { title: 'Fantasmi interrotti di Alice',     artist: 'Julinko',          duration: 276 },
  { title: 'Strategia della tensione',         artist: 'G.A.Z.A.',         duration: 353 },
  { title: 'Alice E Le Onde Eterne Della Fine',artist: 'Paolo L. Bandera', duration: 412 },
];

let currentTrack = 2;
let isPlaying = false;
let elapsed = 0;
let lastTime = null;
let timerInterval = null;

const playBtn      = document.getElementById('playBtn');
const soundBtn     = document.getElementById('soundBtn');
const trackNameEl  = document.getElementById('trackName');
const artistNameEl = document.getElementById('artistName');
const timeEl       = document.getElementById('timeDisplay');
const progFill     = document.getElementById('progressFill');
const progBar      = document.getElementById('progressBar');
const tlPanel      = document.getElementById('tlPanel');
const tlList       = document.getElementById('tlList');
const overlay      = document.getElementById('overlay');

function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0'); }

function loadTrack(idx){
  currentTrack = idx;
  elapsed = 0;
  trackNameEl.textContent  = tracks[idx].title;
  artistNameEl.textContent = tracks[idx].artist;
  timeEl.textContent = fmt(0);
  progFill.style.width = '0%';
  document.querySelectorAll('.tl-item').forEach((el,i) => el.classList.toggle('active', i===idx));
}

function tick(){
  if(!isPlaying) return;
  const now = performance.now();
  elapsed += (now - lastTime) / 1000;
  lastTime = now;
  const dur = tracks[currentTrack].duration;
  if(elapsed >= dur){ elapsed = 0; loadTrack((currentTrack+1) % tracks.length); }
  timeEl.textContent = fmt(elapsed);
  progFill.style.width = (elapsed / dur * 100).toFixed(2) + '%';
}

function togglePlay(){
  isPlaying = !isPlaying;
  playBtn.dataset.state = isPlaying ? 'playing' : 'paused';
  soundBtn.dataset.state = isPlaying ? 'playing' : 'paused';
  if(isPlaying){ lastTime = performance.now(); timerInterval = setInterval(tick, 80); }
  else { clearInterval(timerInterval); }
}

playBtn.addEventListener('click', togglePlay);
soundBtn.addEventListener('click', togglePlay);

document.getElementById('prevBtn').addEventListener('click', () => {
  loadTrack((currentTrack - 1 + tracks.length) % tracks.length);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  loadTrack((currentTrack + 1) % tracks.length);
});

progBar.addEventListener('click', e => {
  const r = progBar.getBoundingClientRect();
  const ratio = (e.clientX - r.left) / r.width;
  elapsed = ratio * tracks[currentTrack].duration;
  lastTime = performance.now();
});

/* build tracklist */
tracks.forEach((t, i) => {
  const li = document.createElement('div');
  li.className = 'tl-item' + (i === currentTrack ? ' active' : '');
  li.innerHTML = `<span>${t.title}</span><span>${t.artist}</span>`;
  li.addEventListener('click', () => { loadTrack(i); if(!isPlaying) togglePlay(); });
  tlList.appendChild(li);
});

document.getElementById('openTracklist').addEventListener('click', () => {
  tlPanel.classList.add('open');
  overlay.classList.add('open');
});
document.getElementById('closeTracklist').addEventListener('click', () => {
  tlPanel.classList.remove('open');
  overlay.classList.remove('open');
});
overlay.addEventListener('click', () => {
  tlPanel.classList.remove('open');
  overlay.classList.remove('open');
});

/* ── WEBGL FLUID SHADER ── */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl');

const VS = `
attribute vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const FS = `
precision highp float;
uniform vec2  u_res;
uniform float u_time;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
    mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
    u.y
  );
}

float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for(int i = 0; i < 6; i++){
    v += a * noise(p);
    p  = p * 2.1 + vec2(1.7, 9.2);
    a *= 0.5;
  }
  return v;
}

void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  uv.y = 1.0 - uv.y;

  float t = u_time * 0.16;

  /* two layers of domain warping — same technique as the original */
  vec2 q = vec2(
    fbm(uv + t),
    fbm(uv + vec2(1.0))
  );
  vec2 r = vec2(
    fbm(uv + 2.0 * q + vec2(1.7,  9.2) + 0.15 * t),
    fbm(uv + 2.0 * q + vec2(8.3,  2.8) + 0.126 * t)
  );

  float f = fbm(uv + 2.8 * r);
  f = smoothstep(0.0, 1.0, f);

  vec3 white  = vec3(0.984, 0.984, 0.984);
  vec3 pinkish = vec3(1.0,  0.72, 0.72);
  vec3 red1   = vec3(0.87, 0.0,  0.05);
  vec3 red2   = vec3(0.6,  0.0,  0.04);

  vec3 col = mix(white,   pinkish, f);
       col = mix(col,     red1,    pow(f, 2.8) * 1.3);
       col = mix(col,     red2,    pow(f, 6.0) * 0.6);

  gl_FragColor = vec4(col, 1.0);
}
`;

function mkShader(src, type){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, mkShader(VS, gl.VERTEX_SHADER));
gl.attachShader(prog, mkShader(FS, gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

const aPos  = gl.getAttribLocation(prog, 'a_pos');
const uRes  = gl.getUniformLocation(prog, 'u_res');
const uTime = gl.getUniformLocation(prog, 'u_time');

gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

function resize(){
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const start = performance.now();
function render(){
  const t = (performance.now() - start) / 1000;
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(render);
}
render();

// ── NEXT PAGE TRANSITION ──
document.getElementById('nextPageBtn').addEventListener('click', () => {
  const ov = document.getElementById('page-overlay');
  ov.style.pointerEvents = 'all';
  ov.style.opacity = '1';
  setTimeout(() => { window.location.href = 'memories.html'; }, 750);
});
</script>
</body>
</html>
